name: build-iosroot

# Builds the HFS+ iPadOS root image that the nabu shim/kernel mounts as
# ufsroot0.  This job only PRODUCES the image; flashing it is a separate,
# destructive step (fastboot flash userdata wipes Android) that the owner
# must trigger deliberately.
#
# Inputs are taken straight from the Apple IPSW, so nothing Apple-derived is
# stored in this repo:
#   096-57366-083.dmg  ~4.25 GB  OS root filesystem      (UDIF/APFS)
#   096-56782-083.dmg  ~2.67 GB  SystemOS cryptex        (raw APFS)
#   096-57613-084.dmg  ~10 MB    App cryptex             (raw APFS)

on:
  workflow_dispatch:
    inputs:
      size:
        description: HFS+ image size passed to mkiosroot.sh
        default: "16G"
      upload:
        description: upload the finished image as an artifact (needs < 9G)
        default: "true"

concurrency:
  group: iosroot-${{ github.ref }}
  cancel-in-progress: true

env:
  IPSW_URL: https://updates.cdn-apple.com/2023SummerFCS/fullrestores/042-44385/366890C4-D9B5-4938-B399-C19FB58DBEE0/iPad_Pro_HFR_16.6.1_20G81_Restore.ipsw
  OS_DMG: 096-57366-083.dmg
  SYS_DMG: 096-56782-083.dmg
  APP_DMG: 096-57613-084.dmg
  IMG_SIZE: ${{ inputs.size || '16G' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # The runner image ships ~60G of preinstalled SDKs; this job needs
      # ~18G peak (5.6G IPSW + 7G DMGs + 10G HFS+ image) but only ~13G is
      # free out of the box, which made curl die with exit 11 mid-download.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /opt/az \
                      /usr/lib/google-cloud-sdk /usr/local/.ghcup \
                      /opt/microsoft /usr/share/swift || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hfsprogs rsync unzip curl cmake g++ \
                                      libfuse3-dev libbz2-dev zlib1g-dev libssl-dev \
                                      android-sdk-libsparse-utils
          # Ubuntu has no apfs-fuse package, so build it from source.
          if ! command -v apfs-fuse >/dev/null 2>&1; then
            git clone -q --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/sgan81/apfs-fuse.git /tmp/apfs-fuse
            cmake -S /tmp/apfs-fuse -B /tmp/apfs-fuse/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/apfs-fuse/build -j"$(nproc)"
            sudo cmake --install /tmp/apfs-fuse/build
          fi
          command -v apfs-fuse
          apfs-fuse 2>&1 | head -3 || true
          command -v mkfs.hfsplus
          command -v img2simg || echo "img2simg missing (sparse step will be skipped)"
          ls -l /dev/fuse
          # mkiosroot.sh mounts the new image with -t hfsplus, so that module
          # has to be loaded; Ubuntu does not load it by default and the
          # runner image ships a trimmed module set.
          sudo modprobe hfsplus 2>&1 || true
          if ! grep -qw hfsplus /proc/filesystems; then
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || \
              echo "linux-modules-extra-$(uname -r) not installable"
            sudo depmod -a 2>/dev/null || true
            sudo modprobe hfsplus 2>&1 || true
          fi
          if grep -qw hfsplus /proc/filesystems; then
            echo "hfsplus module ready"
          else
            echo "!! hfsplus still unavailable"
          fi
          df -h / | tail -1

      - name: Fetch IPSW
        run: |
          time curl -L --retry 3 --retry-delay 5 -o ipsw.zip "$IPSW_URL"
          ls -l ipsw.zip
          df -h / | tail -1

      - name: Extract the three DMGs
        run: |
          mkdir -p ipsw
          unzip -o ipsw.zip "$OS_DMG" "$SYS_DMG" "$APP_DMG" -d ipsw
          ls -l ipsw/
          rm -f ipsw.zip
          df -h / | tail -1

      - name: Build HFS+ root
        run: |
          # mkiosroot.sh mounts through apfs-fuse and rsyncs as root
          sudo -E bash tools/mkiosroot.sh \
            "ipsw/$OS_DMG" "ipsw/$SYS_DMG" "ipsw/$APP_DMG" \
            out.img "$IMG_SIZE"
          ls -lh out.img

      # The launchd console patch and the migration/Setup/containers tweaks are
      # applied inside tools/mkiosroot.sh, while the volume is still mounted
      # read-write: Linux hfsplus cannot re-mount this journaled image rw after
      # it has been unmounted ("Read-only file system"), which silently lost
      # two whole builds.  The step below only verifies the result.

      - name: Verify userland tweaks landed
        run: |
          # Everything below gates SpringBoard: if one of these is missing the
          # boot stops at the progress bar with no error on the panel.
          sudo mkdir -p /mnt/root
          sudo mount -o loop,ro out.img /mnt/root
          python3 - <<'PY'
          import os, plistlib, sys
          root = '/mnt/root'
          pref = root + '/private/var/mobile/Library/Preferences/'
          sv = plistlib.load(open(root + '/System/Library/CoreServices/SystemVersion.plist', 'rb'))
          build = sv['ProductBuildVersion']
          bad = []
          def chk(name, ok):
              print(('OK   ' if ok else 'FAIL ') + name)
              if not ok:
                  bad.append(name)
          def pref_d(name):
              return plistlib.load(open(pref + name, 'rb'))
          try:
              chk('migration LastSystemVersion == ' + build,
                  pref_d('com.apple.migration.plist').get('LastSystemVersion') == build)
          except Exception as e:
              chk('migration plist (%s)' % e, False)
          try:
              chk('purplebuddy SetupDone', pref_d('com.apple.purplebuddy.plist').get('SetupDone') is True)
          except Exception as e:
              chk('purplebuddy plist (%s)' % e, False)
          chk('containers/Bundle', os.path.isdir(root + '/private/var/containers/Bundle'))
          lp = plistlib.load(open(root + '/System/Library/xpc/launchd.plist', 'rb'))['LaunchDaemons']
          chk('no _PanicOnCrash left', not any('_PanicOnCrash' in j for j in lp.values()))
          chk('backboardd -> /dev/console',
              any(j.get('Label') == 'com.apple.backboardd' and
                  j.get('StandardErrorPath') == '/dev/console' for j in lp.values()))
          dsc = root + '/System/Library/Caches/com.apple.dyld'
          names = os.listdir(dsc) if os.path.isdir(dsc) else []
          filled = [f for f in names if os.path.getsize(os.path.join(dsc, f)) > 0]
          if not filled:
              print('WARN dyld shared cache is 0 bytes (%d entries); the image then '
                    'needs launchd_unsecure_cache=1 and cannot symbolicate' % len(names))
          else:
              print('OK   dyld shared cache (%d files)' % len(filled))
          sys.exit(1 if bad else 0)
          PY
          sudo umount /mnt/root

      - name: Measure
        run: |
          set -x
          ls -l out.img
          du -h --apparent-size out.img
          sudo mkdir -p /mnt/root && sudo mount -o loop,ro out.img /mnt/root || true
          if mountpoint -q /mnt/root; then
            # du exits 1 on dangling shortcuts (Thai .shortcut stubs); that is
            # harmless, so never let it abort the job.
            sudo du -sh /mnt/root || true
            sudo du -sh /mnt/root/* 2>/dev/null | sort -hr | head -20 || true
            ls /mnt/root/System/Library/CoreServices/ 2>/dev/null || true
            if [ -e /mnt/root/sbin/launchd ]; then echo "launchd present"; else echo "!! launchd MISSING"; fi
            sudo umount /mnt/root || true
          fi
          df -h / | tail -1

      - name: Compress
        run: |
          set -x
          sudo apt-get install -y -qq zstd
          sha256sum out.img | tee SHA256SUMS
          # 16G image with ~11G used: the zero fill compresses away, and
          # iOS payload is largely pre-compressed, so expect roughly 4-6G.
          zstd -6 -T0 --long=27 out.img -o out.img.zst
          ls -lh out.img.zst
          sha256sum out.img.zst | tee -a SHA256SUMS
          { echo "raw  : $(stat -c %s out.img) bytes"; \
            echo "zstd : $(stat -c %s out.img.zst) bytes"; } > SIZES.txt
          cat SIZES.txt
          rm -f out.img ipsw/*.dmg

      # Release assets are served from objects.githubusercontent.com, which is
      # a different (usually much faster) CDN than the Actions artifact blob
      # store. GitHub caps a single asset at 2 GiB, so split into <1900 MiB
      # parts. Download the parts and `cat` them back together.
      - name: Publish as release assets
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f out.img.zst ]; then echo "no image, skipping"; exit 0; fi
          split -b 1900M out.img.zst part-
          ls -lh part-*
          tag="iosroot-$(date -u +%Y%m%d-%H%M%S)"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release create "$tag" part-* SHA256SUMS SIZES.txt \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --notes "iPadOS 16.6.1 HFS+ root for nabu. Concatenate the parts in order, then: zstd -d." 
          { echo "concat: cat part-* > out.img.zst"; \
            echo "unpack: zstd -d out.img.zst -o out.img"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iosroot-image
          path: |
            out.img.zst
            SHA256SUMS
            SIZES.txt
          retention-days: 5
          compression-level: 0
          if-no-files-found: warn
